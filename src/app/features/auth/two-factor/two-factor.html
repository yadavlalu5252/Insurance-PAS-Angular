
<div class="container min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card border-0 shadow-lg rounded-4 w-100" style="max-width: 440px;">
    <div class="card-body p-4 p-md-5">
      <h2 class="text-center fw-bold mb-2">Two-Factor Verification</h2>
      <p class="text-center text-secondary mb-4">Enter your 6-digit authenticator code.</p>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <form [formGroup]="twoFactorForm" (ngSubmit)="VerifyTwoFactor()">
  <div class="mb-3">
    <label for="code" class="form-label">Verification Code</label>
    <input id="code" type="text" class="form-control" formControlName="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter 6-digit code" />
    <div class="text-danger" *ngIf="twoFactorForm.controls.code.touched && twoFactorForm.controls.code.invalid">Please enter a valid 6-digit verification code.</div>
  </div>

  <div class="text-danger mb-3" *ngIf="errorMessage">{{ errorMessage }}</div>

  <button type="submit" class="btn btn-primary" [disabled]="loading">
    {{ loading ? 'Verifying...' : 'Verify Code' }}
  </button>
</form>
    </div>
  </div>
</div>
