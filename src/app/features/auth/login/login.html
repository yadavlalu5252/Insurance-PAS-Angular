
<div class="container-fluid min-vh-100 bg-light d-flex align-items-center justify-content-center py-5 px-3">
  <div class="card border-0 shadow-lg rounded-4 w-100" style="max-width: 440px;">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h2 class="fw-bold">Welcome Back</h2>
        <p class="text-secondary mb-0">Sign in to your Insurance PAS account</p>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-4">
          <label for="username" class="form-label fw-semibold">Username</label>
          <input id="username" type="text" class="form-control form-control-lg rounded-3" formControlName="username" placeholder="Enter your username" autocomplete="username" [class.is-invalid]="f.username.touched && f.username.invalid">
          <div class="invalid-feedback" *ngIf="f.username.touched && f.username.hasError('required')">Username is required.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group input-group-lg">
            <input id="password" [type]="showPassword ? 'text' : 'password'" class="form-control rounded-start-3" formControlName="password" placeholder="Enter your password" autocomplete="current-password" [class.is-invalid]="f.password.touched && f.password.invalid">
            <button type="button" class="btn btn-outline-secondary rounded-end-3" (click)="togglePassword()">{{ showPassword ? 'Hide' : 'Show' }}</button>
          </div>
          <div class="text-danger small mt-1" *ngIf="f.password.touched && f.password.hasError('required')">Password is required.</div>
          <div class="text-danger small mt-1" *ngIf="f.password.touched && f.password.hasError('minlength')">Password must contain at least 8 characters.</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input id="rememberMe" type="checkbox" class="form-check-input">
            <label for="rememberMe" class="form-check-label text-secondary">Remember me</label>
          </div>
          <a routerLink="/forgot-password" class="text-primary text-decoration-none small fw-semibold">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg rounded-3 w-100 fw-semibold" [disabled]="loading">
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>
    </div>
  </div>
</div>
