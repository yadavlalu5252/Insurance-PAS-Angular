<!-- 🚨 Added 250px left margin for the sidebar and right padding -->
<div class="container-fluid mt-4" style="margin-left: 250px; padding-right: 20px;">

  <h3 class="mb-4">Contact Update</h3>

  <div class="card shadow-sm">
    <div class="card-body p-4">

      <form [formGroup]="contactForm" (ngSubmit)="SaveContact(contactForm.value)">

        <!-- Policy Dropdown -->
        <div class="mb-3">
          <label class="form-label fw-bold">Select Policy</label>
          <select class="form-select" formControlName="policyId">
            <option value="">-- Select a policy --</option>
            <option *ngFor="let p of allpolicies" [value]="p.policy_id">
              {{ p.policy_number }} (Status : {{p.policy_status}})
            </option>
          </select>
        </div>

        <div class="row">
          <!-- Mobile Number -->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Mobile Number</label>
            <input type="text" class="form-control" formControlName="mobile_number">
          </div>

          <!-- Email Address -->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Email Address</label>
            <input type="email" class="form-control" formControlName="email">
          </div>
        </div>

        <!-- Send OTP Button -->
        <div class="mb-3">
          <button type="button" class="btn btn-warning text-dark fw-bold" (click)="SendOtp()">
            Send OTP to Email
          </button>
        </div>

        <!-- Enter OTP -->
        <div class="mb-4">
          <label class="form-label fw-bold">Enter OTP</label>
          <input type="text" class="form-control" formControlName="otpCode" placeholder="Enter the 6-digit code">
        </div>

        <!-- Submit Button -->
        <div class="d-grid gap-2">
          <input type="submit" class="btn btn-primary" value="Submit Contact Update">
        </div>

      </form>

    </div>
  </div>
</div>
