<!-- 🚨 Replaced 'pe-5' with a 250px left margin for the sidebar -->
<div class="container-fluid mt-4" style="margin-left: 250px; padding-right: 20px;">

  <h3 class="mb-4">Policy Cancellation</h3>

  <button class="btn btn-primary mb-4" (click)="openModal()">
    Cancel a Policy
  </button>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-bordered table-striped table-hover mb-0" *ngIf="policydetails">
        <thead class="table-dark">
          <tr>
            <th scope="col">Cancellation Id</th>
            <th scope="col">Policy ID</th>
            <th scope="col">Cancellation Date</th>
            <th scope="col">Cancellation Reason</th>
            <th scope="col">Refund Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">{{policydetails.cancellation_id}}</th>
            <td>{{policydetails.policy_id}}</td>
            <td>{{policydetails.cancellation_date}}</td>
            <td>{{policydetails.cancellation_reason}}</td>
            <td>{{policydetails.refund_amount}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal show d-block" tabindex="-1" *ngIf="isModalOpen" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">

      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Cancel Policy</h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeModal()"></button>
      </div>

      <div class="modal-body p-4">
        <form [formGroup]="cancelform" (ngSubmit)="cancel(cancelform.value)">

          <div class="mb-3">
            <label class="form-label fw-bold">Select Policy</label>
            <select class="form-select" formControlName="policyId">
              <option value="">-- Select a policy --</option>
              <option *ngFor="let p of allpolicies" [value]="p.policy_id">
                {{ p.policy_number }} (Status : {{p.policy_status}})
              </option>
            </select>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">Cancellation Reason</label>
            <input type="text" class="form-control" formControlName="CancellationReason"
              placeholder="e.g. Too expensive">
          </div>

          <div class="d-grid gap-2">
            <input type="submit" class="btn btn-danger" value="Confirm Cancellation">
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
