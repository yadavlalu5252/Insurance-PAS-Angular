<!-- 🚨 Added 250px left margin for the sidebar and right padding -->
<div class="container-fluid mt-4" style="margin-left: 250px; padding-right: 20px;">

  <h3 class="mb-4">Policy Renewal</h3>

  <button class="btn btn-primary mb-4" (click)="openModal()">
    Renew a Policy
  </button>

  <!-- Card wrapper with bordered and striped table -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-bordered table-striped table-hover mb-0" *ngIf="policydetails">
        <thead class="table-dark">
          <tr>
            <th scope="col">Renewal ID</th>
            <th scope="col">Policy ID</th>
            <th scope="col">Renewal Date</th>
            <th scope="col">New Expiry Date</th>
            <th scope="col">Premium Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">{{policydetails.renewal_id}}</th>
            <td>{{policydetails.policy_id}}</td>
            <td>{{policydetails.renewal_date}}</td>
            <td>{{policydetails.new_expiry_date}}</td>
            <td>{{policydetails.premium_amount}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal show d-block" tabindex="-1" *ngIf="isModalOpen" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">

      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Renew Policy</h5>
        <!-- Added working close button -->
        <button type="button" class="btn-close btn-close-white" (click)="closeModal()"></button>
      </div>

      <div class="modal-body p-4">
        <form [formGroup]="renewalform" (ngSubmit)="renew(renewalform.value)">

          <!-- Added labels and spacing -->
          <div class="mb-3">
            <label class="form-label fw-bold">Select Policy</label>
            <select class="form-select" formControlName="policyId">
              <option value="">-- Select a policy --</option>
              <option *ngFor="let p of allpolicies" [value]="p.policy_id">
                {{ p.policy_number }} (Status : {{p.policy_status}})
              </option>
            </select>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">New Expiry Date</label>
            <input type="date" class="form-control" formControlName="NewExpiryDate">
          </div>

          <div class="d-grid gap-2">
            <input type="submit" class="btn btn-primary" value="Renew Policy">
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
