
<div class="container-fluid py-4 quote-form-page">
  <!-- Header -->
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
      <h1 class="h2 fw-bold mb-2">Generate Quote</h1>
      <p class="text-secondary mb-0">
        Create a new insurance quotation.
      </p>
    </div>

    <button
      type="button"
      class="btn btn-outline-secondary"
      (click)="cancel()">
      <i class="bi bi-arrow-left me-2"></i>
      Back to Quotes
    </button>
  </div>

  <!-- Quote Form -->
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white py-3 px-4">
      <h2 class="h5 fw-semibold mb-0">
        <i class="bi bi-file-earmark-text text-primary me-2"></i>
        Quote Details
      </h2>
    </div>

    <div class="card-body p-4">
      <form (ngSubmit)="submitQuote()">
        <div class="row g-4">

          <!-- Customer ID -->
          <div class="col-12 col-md-6">
            <label for="customer" class="form-label fw-semibold">
              Customer ID <span class="text-danger">*</span>
            </label>

            <input
              id="customer"
              type="number"
              class="form-control"
              name="customer_id"
              [(ngModel)]="form.customer_id"
              placeholder="Enter customer ID"
              min="1"
              required />

           
          </div>

          <!-- Insurance Product -->
          <div class="col-12 col-md-6">
            <label for="product" class="form-label fw-semibold">
              Insurance Product <span class="text-danger">*</span>
            </label>

            <select
              id="product"
              class="form-select"
              name="product_id"
              [(ngModel)]="form.product_id"
              required>
              <option [ngValue]="null">Select an insurance product</option>

              <option
                *ngFor="let p of products"
                [ngValue]="p.product_id ?? p.productId">
                {{ p.product_name ?? p.productName ?? p.name }}
              </option>
            </select>

            <div *ngIf="loadingProducts" class="form-text">
              <span class="spinner-border spinner-border-sm me-2"
                    role="status"></span>
              Loading products...
            </div>
          </div>

          <!-- Policy Term -->
          <div class="col-12 col-md-6">
            <label for="term" class="form-label fw-semibold">
              Policy Term (Years) <span class="text-danger">*</span>
            </label>

            <input
              id="term"
              type="number"
              class="form-control"
              name="policy_term"
              [(ngModel)]="form.policy_term"
              min="1"
              max="100"
              placeholder="Enter policy term"
              required />
          </div>

          <!-- Sum Insured -->
          <div class="col-12 col-md-6">
            <label for="sumInsured" class="form-label fw-semibold">
              Sum Insured (₹) <span class="text-danger">*</span>
            </label>

            <div class="input-group">
              <span class="input-group-text">₹</span>
              <input
                id="sumInsured"
                type="number"
                class="form-control"
                name="sum_insured"
                [(ngModel)]="form.sum_insured"
                min="1"
                placeholder="Enter sum insured"
                required />
            </div>
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="alert alert-danger mt-4 mb-0">
          <i class="bi bi-exclamation-circle me-2"></i>
          {{ errorMessage }}
        </div>

        <!-- Actions -->
        <div class="d-flex flex-wrap justify-content-end gap-2 mt-4 pt-3 border-top">
          <button
            type="button"
            class="btn btn-light border"
            (click)="cancel()">
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-primary px-4"
            [disabled]="saving || loadingProducts">
            <span
              *ngIf="saving"
              class="spinner-border spinner-border-sm me-2"
              role="status"></span>

            <i *ngIf="!saving" class="bi bi-check-circle me-2"></i>
            {{ saving ? 'Creating Quote...' : 'Generate Quote' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
